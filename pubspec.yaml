name: Ringplus
description: A Cloud Pbx
publish_to: "none"
version: 1.0.2+7

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core SIP VoIP SDK
  siprix_voip_sdk: 1.0.32 # Pinned to avoid Android compilation issues with 1.0.26

  # Push notifications for Android incoming calls --- this one
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4

  # State management
  provider: ^6.1.1
  riverpod: ^3.0.3
  flutter_riverpod: ^3.0.3

  # Storage and persistence
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path: ^1.8.3

  # UI and navigation - go_router -- this one
  go_router: ^17.0.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Audio and media
  just_audio: ^0.10.5
  audio_session: ^0.2.2
  permission_handler: ^12.0.1

  # Networking and HTTP
  dio: ^5.4.0
  connectivity_plus: ^7.0.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  package_info_plus: ^9.0.0
  device_info_plus: ^12.2.0
  path_provider: ^2.1.1

  # Contacts
  flutter_contacts: ^1.1.7+1

  # Icons and fonts
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296

  # Development and debugging
  logger: ^2.0.2+1

  # JWT token handling
  dart_jsonwebtoken: ^3.3.1

  #tt test notifiaction
  awesome_notifications: ^0.10.1

  is_lock_screen2: ^2.0.4

  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - .env
#    - assets/icons/
#    - assets/sounds/

